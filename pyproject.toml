[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "problemforger"
version = "0.1.0"
description = "Harness-neutral core for externally governed problem graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["problemforger*"]

[tool.coverage.run]
branch = true
source = ["problemforger", "scripts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
