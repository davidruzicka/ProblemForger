name: Request Codex review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review

permissions:
  issues: write

concurrency:
  group: codex-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'review-loop')
    runs-on: ubuntu-24.04
    steps:
      - name: Request Codex review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- problemforger-codex-review-request -->';
            const headSha = context.payload.pull_request.head.sha;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            const alreadyRequested = comments.some(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker) &&
                comment.body?.includes(headSha),
            );

            if (alreadyRequested) {
              core.info(`Codex review already requested for ${headSha}`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `${marker}\n@codex review\n\nRequested automatically for head \`${headSha}\`.`,
            });
